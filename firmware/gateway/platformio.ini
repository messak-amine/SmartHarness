[platformio]
default_envs = esp32-sim

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    marvinroger/AsyncMqttClient@0.9.0
    esp32async/AsyncTCP@3.5.0

[env:esp32-sim]
build_flags = -D SIMULATED_CAN=1

[env:esp32-can]
build_flags = -D SIMULATED_CAN=0
