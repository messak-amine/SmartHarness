<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img" aria-labelledby="title description">
<title id="title">SmartHarness architecture and implementation boundary</title>
<desc id="description">ECU A monitors headlights and indicators; ECU B monitors brake lights and ventilation. They send fault frames to a shared virtual CAN bus, received by the gateway and shown as JSON in the terminal. MQTT, Node-RED and SQLite are planned but not implemented.</desc>
<defs><pattern id="dot" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#3d5269" opacity=".36"/></pattern></defs>
<rect width="1440" height="650" rx="18" fill="#0e1928"/>
<rect x="1" y="1" width="1438" height="648" rx="17" fill="url(#dot)" stroke="#30445b"/>
<text x="42" y="57" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f1f6fa">System flow</text>
<text x="42" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a1b5c8">Fault detection happens at the ECU, not in the gateway.</text>
<rect x="1103" y="33" width="291" height="37" rx="18" fill="#193e3e" stroke="#47bba6"/>
<circle cx="1124" cy="51" r="6" fill="#51dec1"/><text x="1140" y="57" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#c7f6e9">Implemented in v0.1</text>

