<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 390" role="img" aria-labelledby="title description">
<title id="title">SmartHarness software foundation</title>
<desc id="description">An editorial technical cover, with two independent ECU nodes connected to a virtual CAN bus and gateway.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#162337"/></linearGradient>
  <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5f7791" stroke-width="0.7" opacity=".13"/></pattern>
  <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#38dac3" stop-opacity=".75"/><stop offset="1" stop-color="#8ed2eb" stop-opacity=".9"/></linearGradient>
</defs>
<rect width="1440" height="390" rx="18" fill="url(#bg)"/><rect width="1440" height="390" rx="18" fill="url(#grid)"/>
<rect x="54" y="58" width="5" height="252" rx="2" fill="#40d6c0"/>
