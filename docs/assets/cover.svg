<text x="82" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="69" font-weight="700" letter-spacing="-2.1" fill="#f0f5fa">SmartHarness</text>
<text x="86" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#bed0df">Distributed circuit fault diagnostics</text>
<text x="86" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#bed0df">from local detection to network events.</text>
<rect x="86" y="295" width="172" height="40" rx="8" fill="#233d4e" stroke="#4c7b80"/>
<text x="172" y="322" font-family="Consolas,monospace" font-size="16" text-anchor="middle" fill="#91f0da">SIMULATOR  v0.1</text>
