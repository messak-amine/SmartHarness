<path d="M849 157V278 M1084 157V278" stroke="#43d9c3" stroke-opacity=".75" stroke-width="3" fill="none"/>

<rect x="740" y="66" width="220" height="90" rx="13" fill="#1c3242" stroke="#3c7080" stroke-width="1.6"/>
<rect x="996" y="66" width="220" height="90" rx="13" fill="#1c3242" stroke="#3c7080" stroke-width="1.6"/>
