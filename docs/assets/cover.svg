<text x="1019" y="98" fill="#f5f9fd" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="24">ECU B</text>
<text x="763" y="126" fill="#9eb6ca" font-family="Segoe UI,Arial,sans-serif" font-size="17">Lighting  /  circuits 1–2</text>
