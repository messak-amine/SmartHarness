
name: SmartHarness validation

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run original simulator
        run: python -m simulator.main

      - name: Run expanded simulation
        run: python -m simulator.demo_validation

  native-can:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile and run native CAN tests
        shell: bash
        run: |
          set -euo pipefail

          SRC="firmware/components/smartharness_can/smartharness_can.c"
          INC="firmware/components/smartharness_can/include"

          for test in \
            test_can_encoder \
            test_can_roundtrip \
            test_can_ecu_b \
            test_can_validation
          do
            echo "Running $test"

            gcc -std=c11 -Wall -Wextra -Werror \
              -I"$INC" \
              "$SRC" \
              "tests/native/$test.c" \
              -o "/tmp/$test"

            "/tmp/$test"
          done

          echo "ALL NATIVE CAN TESTS PASSED"

  ecu-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ECU firmware and CAN v1 compatibility
        shell: bash
        run: bash firmware/ecu_firmware/tests/run_tests.sh
