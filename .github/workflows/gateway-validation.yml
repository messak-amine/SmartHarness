name: Gateway MQTT and ESP32 validation
on:
  pull_request:
  push:
    branches: [feat/gateway-mqtt]
  workflow_dispatch:
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: python -m pip install -r requirements.txt
      - name: Run Python tests with the packaged Mosquitto broker
        env:
          MOSQUITTO_BIN: /usr/sbin/mosquitto
        run: |
          # Ubuntu's AppArmor profile allows broker configs under /etc/mosquitto.
          config=$(sudo mktemp /etc/mosquitto/smartharness-test-XXXXXX.conf)
          trap 'sudo rm -f -- "$config"' EXIT
          sudo chown "$(id -u):$(id -g)" "$config"
          MOSQUITTO_TEST_CONFIG="$config" python -m unittest discover -s tests -v
      - name: Test firmware decoder and JSON on host
        run: g++ -std=c++11 -Ifirmware/gateway/include firmware/gateway/protocol_test.cpp -o /tmp/protocol-test && /tmp/protocol-test
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: python -m platformio run -d firmware/gateway -e esp32-sim -e esp32-can
