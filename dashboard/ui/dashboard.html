<template>
  <main class="sh" v-if="msg && msg.payload">
    <header><div><p class="eyebrow">SMARTHARNESS · MISSION 4</p><h1>Diagnostic du faisceau</h1><p>Derniers événements reçus · ECU A et ECU B</p></div><span class="pill">{{ data.total }} réceptions enregistrées</span></header>
    <section class="connections">
      <div><small>Connexion MQTT</small><strong :class="data.mqtt === 'connected' ? 'good' : 'bad'">{{ data.mqtt === 'connected' ? 'Connecté' : 'Déconnecté' }}</strong></div>
      <div><small>Gateway</small><strong>{{ data.gateway === 'online' ? 'En ligne' : data.gateway === 'offline' ? 'Hors ligne' : 'Inconnu' }}</strong></div>
      <div><small>Base SQLite</small><strong :class="data.database === 'ready' ? 'good' : 'bad'">{{ data.database === 'ready' ? 'Disponible' : data.database }}</strong></div>
      <div><small>Présence des ECU</small><strong>Non déterminée</strong></div>
    </section>
    <p class="notice">Le Gateway ne confirme pas la présence des ECU. Les tensions sont celles des derniers événements, pas des mesures continues.</p>
    <section class="summary" aria-label="Résumé des derniers diagnostics">
      <div class="summary-item summary-fault"><span class="summary-number" data-summary="fault">{{ summary.fault }}</span><div><strong>Circuits en panne</strong><small>Dernier diagnostic : panne active</small></div></div>
      <div class="summary-item summary-recovered"><span class="summary-number" data-summary="recovered">{{ summary.recovered }}</span><div><strong>Résolutions reçues</strong><small>État de santé ECU non vérifié</small></div></div>
      <div class="summary-item summary-unknown"><span class="summary-number" data-summary="unknown">{{ summary.unknown }}</span><div><strong>États inconnus</strong><small>Aucun diagnostic dans cette exécution</small></div></div>
    </section>
    <p class="notice summary-caption">Répartition des quatre circuits selon leur dernier événement enregistré, même si la communication n’est plus confirmée. Ce ne sont pas des compteurs d’événements.</p>
    <div role="alert" class="error" v-if="data.last_error">Dernière anomalie : {{ data.last_error }} · Messages rejetés : {{ data.rejected }} · Écritures échouées : {{ data.failed_writes }}</div>
    <section class="circuits">
      <article v-for="c in data.circuits" :key="c.circuit" :class="['circuit', c.status.toLowerCase()]">
        <small>ECU {{ c.ecu }} · CIRCUIT {{ c.circuit }}</small><h2>{{ c.name }}</h2>
        <strong class="diagnosis"><span class="status-symbol" aria-hidden="true">{{ c.status === 'UNKNOWN' ? '?' : c.status === 'RECOVERED' ? '✓' : '!' }}</span>{{ label(c.status) }}</strong>
        <template v-if="c.last">
          <p class="measurement">{{ c.last.voltage_mv }} <span>mV · commande {{ c.last.command_on ? 'ON' : 'OFF' }}</span></p>
          <small>Reçu : {{ time(c.last.received_at) }}</small>
          <p class="health-note" v-if="c.status === 'RECOVERED'">Résolution signalée par l’ECU ; sa présence et sa santé actuelles ne sont pas vérifiées.</p>
          <p class="notice" v-if="c.stale">Dernier état connu · communication non confirmée</p>
        </template>
        <p v-else>Aucun événement reçu pendant cette exécution.</p>
        <small v-if="!c.last && c.historical">Archive : {{ c.historical.active ? 'panne active' : 'résolution' }}, reçue {{ time(c.historical.received_at) }}. État actuel inconnu.</small>
      </article>
    </section>
    <section class="history"><div class="history-title"><h2>Historique des diagnostics</h2><label>Circuit <select v-model="filter"><option value="all">Tous</option><option v-for="c in data.circuits" :value="String(c.circuit)">{{ c.name }}</option></select></label></div>
      <p>200 dernières réceptions · horodatage UTC à la réception par Node-RED, pas à l’apparition de la panne. Les répétitions sont conservées.</p>
      <div class="table-scroll"><table><thead><tr><th>N°</th><th>Réception UTC</th><th>ECU / circuit</th><th>Diagnostic</th><th>Tension</th><th>Commande</th><th>Séquence</th></tr></thead><tbody>
        <tr v-for="row in rows" :key="row.event_id"><td>{{ row.event_id }}</td><td>{{ time(row.received_at) }}</td><td>{{ row.ecu }} / {{ row.circuit }}</td><td><span :class="['event-badge', row.active ? 'event-fault' : 'event-recovered']">{{ row.fault_code === 0 ? 'Résolution reçue' : row.fault_code === 1 ? 'Déconnexion' : 'Intermittence (code 2)' }}</span></td><td>{{ row.voltage_mv }} mV</td><td>{{ row.command_on ? 'ON' : 'OFF' }}</td><td>{{ row.seq }}</td></tr>
        <tr v-if="!rows.length"><td colspan="7">Aucun événement enregistré pour ce filtre.</td></tr>
      </tbody></table></div>
    </section>
  </main>
  <p v-else>Chargement du diagnostic…</p>
</template>
<script>
export default {
  data() { return { filter: 'all' }; },
  computed: {
    data() { return this.msg.payload; },
    summary() {
      return this.data.circuits.reduce((counts, circuit) => {
        if (circuit.status === 'FAULT' || circuit.status === 'INTERMITTENT') counts.fault++;
        else if (circuit.status === 'RECOVERED') counts.recovered++;
        else counts.unknown++;
        return counts;
      }, { fault: 0, recovered: 0, unknown: 0 });
    },
    rows() { return this.data.history.filter(r => this.filter === 'all' || String(r.circuit) === this.filter); }
  },
  methods: {
    label(value) { return {UNKNOWN:'INCONNU', FAULT:'PANNE · déconnexion', INTERMITTENT:'PANNE · intermittence', RECOVERED:'RÉSOLUTION REÇUE'}[value]; },
    time(value) { return value ? value.replace('T', ' ').replace('Z', ' UTC') : '—'; }
  }
};
</script>
